name: CI - Code Quality & Multi-Platform Desktop Build

on:
  push:
    branches: [ dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.clinerules/**'
      - '.cursor/**'
      - '.windsurf/**'
      - '.opencode/**'
      - 'brag-output/**'
      - 'presets/**'
      - 'skills-lock.json'
      - 'LICENSE'
      - '.gitignore'
      - '**.mp4'
      - '**.png'
      - '**.jpg'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.clinerules/**'
      - '.cursor/**'
      - '.windsurf/**'
      - '.opencode/**'
      - 'brag-output/**'
      - 'presets/**'
      - 'skills-lock.json'
      - 'LICENSE'
      - '.gitignore'
      - '**.mp4'
      - '**.png'
      - '**.jpg'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the SDK so analyze/test/build results are reproducible; bump this
  # deliberately (matches the version Dogs deployed to developers).
  FLUTTER_VERSION: '3.47.7'

jobs:
  quality-and-test:
    name: Code Quality, Formatting & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pub Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/git
          key: pub-ubuntu-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-ubuntu-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Test Suite with Coverage
        run: flutter test --coverage

      - name: Enforce Minimum Line Coverage
        run: |
          rate=$(awk '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if (lf == 0) { print 0 } else { printf "%.1f", (lh / lf) * 100 } }' coverage/lcov.info)
          echo "Line coverage: ${rate}% (minimum: ${COVERAGE_MIN}%)"
          awk -v rate="$rate" -v min="${COVERAGE_MIN}" 'BEGIN { if (rate + 0 < min + 0) exit 1 }'
        env:
          # AGENTS.md DoD target is 80%; the suite is regaining coverage
          # toward that bar, so the gate creeps up instead of failing red.
          COVERAGE_MIN: '55'

      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: quality-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            build_cmd: flutter build windows --release
          - target: linux
            os: ubuntu-24.04
            build_cmd: flutter build linux --release
          - target: macos
            os: macos-latest
            build_cmd: flutter build macos --release

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pub Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/git
          key: pub-${{ matrix.target }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ matrix.target }}-

      - name: Install Linux Build Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Release Binary
        run: ${{ matrix.build_cmd }}
