name: Release - Multi-Platform Distribution

# Real releases only: a version tag push or a manual dispatch naming a tag.
# Plain pushes to main are verified by CI; they no longer pay the full
# 3-OS build matrix for artifacts nobody consumes.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.1.3)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never kill an in-flight release build; later runs queue.
  cancel-in-progress: false

env:
  # Pin the SDK so release builds match the CI that approved the code.
  FLUTTER_VERSION: '3.47.7'

jobs:
  quality-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pub Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/git
          key: pub-ubuntu-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-ubuntu-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test --coverage

  build-windows:
    name: Build Windows Release
    needs: quality-and-test
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pub Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/Pub/Cache/hosted
          key: pub-windows-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-windows-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "gramercy-windows-x64.zip"

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gramercy-windows-x64
          path: gramercy-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux Release
    needs: quality-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pub Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/git
          key: pub-linux-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-linux-

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Binary
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          tar -czf gramercy-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Bundle Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gramercy-linux-x64
          path: gramercy-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS Release
    needs: quality-and-test
    runs-on: macos-latest
    # Flutter stable (>= 3.47) builds universal2 (x86_64+arm64) macos apps by
    # default; verified 2026-10: lipo shows both arches. FLUTTER_MACOS_ARM64_ONLY=0
    # pins that behavior when Flutter later flips the default to arm64-only.
    env:
      FLUTTER_MACOS_ARM64_ONLY: '0'
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pub Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/git
          key: pub-macos-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-macos-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Package macOS Bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/gramercy.app gramercy-macos.zip

      - name: Upload macOS Bundle Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gramercy-macos
          path: gramercy-macos.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-linux, build-macos]
    # Publish only for real release events: a tag push or a manual dispatch
    # that explicitly names a tag. Plain pushes to main build and verify but
    # can never overwrite an existing release at a different commit.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            TAG="${RELEASE_REF#refs/tags/}"
          elif [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          else
            # Unreachable today because the job gate above requires a tag
            # push or an explicit dispatch tag; kept as a safe fallback.
            VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
            TAG="v${VERSION}"
          fi
          echo "Release tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Windows Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gramercy-windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gramercy-linux-x64

      - name: Download macOS Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gramercy-macos

      # Stamp every published filename with the release tag so multi-version
      # downloads stay unambiguous.
      - name: Stamp Artifacts with Release Version
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          mv gramercy-windows-x64.zip "gramercy-windows-x64-${TAG}.zip"
          mv gramercy-linux-x64.tar.gz "gramercy-linux-x64-${TAG}.tar.gz"
          mv gramercy-macos.zip "gramercy-macos-${TAG}.zip"

      - name: Generate SHA256 Checksums
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          sha256sum "gramercy-windows-x64-${TAG}.zip" "gramercy-linux-x64-${TAG}.tar.gz" "gramercy-macos-${TAG}.zip" > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Gramercy ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            gramercy-windows-x64-*.zip
            gramercy-linux-x64-*.tar.gz
            gramercy-macos-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
